<div class="bg-success text-white text-center fs-4 py-1 mb-2">
  Tarefas - {{ hoje | date: 'dd/MM/yyyy' }}
</div>

<div class="d-flex justify-content-end px-2 mb-3">
  <a class="btn btn-primary" routerLink="/tarefa-nova">
    Adicionar <i class="bi bi-plus-circle"></i>
  </a>
</div>

<div class="d-flex flex-wrap justify-content-center gap-3 px-2">
  <div class="card" style="width: 18rem" *ngFor="let tarefa of tarefas">
    <div class="card-body">
      <small class="fw-bold text-uppercase">{{ tarefa.prioridade }}</small>
      <h5 class="card-title">{{ tarefa.nome }}</h5>
      <p class="card-text text-muted fw-semibold">
        Vencimento {{ tarefa.data | date: 'dd/MM/yyyy' }}
      </p>
         <a class="btn btn-warning btn-sm me-2" [routerLink]="['/tarefa-atualiza', tarefa.id]">
        Editar <i class="bi bi-pencil-square"></i>
      </a>
      <button class="btn btn-danger btn-sm" (click)="deletar(tarefa.id)">
        Deletar <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>
</div>
