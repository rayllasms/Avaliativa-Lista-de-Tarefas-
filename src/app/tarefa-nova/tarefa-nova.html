<div class="bg-success text-white text-center fs-4 py-1 mb-3">Nova Tarefa</div>

<form class="px-3" (ngSubmit)="salvar()">
  <div class="mb-3">
    <label class="form-label" for="nome">Nome</label>
    <input id="nome" name="nome" type="text" class="form-control"
           placeholder="Informe a tarefa" [(ngModel)]="tarefa.nome">
  </div>

  <div class="mb-3">
    <label class="form-label" for="prioridade">Prioridade</label>
    <select id="prioridade" name="prioridade" class="form-select"
            [(ngModel)]="tarefa.prioridade">
      <option value="Alto">Alto</option>
      <option value="Médio">Médio</option>
      <option value="Baixo">Baixo</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label" for="data">Data limite</label>
    <input id="data" name="data" type="date" class="form-control"
           [(ngModel)]="tarefa.data">
  </div>

  <div class="mb-2">
    <label class="form-label" for="categoria">Categoria</label>
    <input id="categoria" name="categoria" type="text" class="form-control"
           readonly [(ngModel)]="tarefa.categoria">
  </div>

  <div class="mb-3">
    <button type="button" class="btn btn-outline-primary btn-sm me-2"
            *ngFor="let c of categorias" (click)="escolherCategoria(c)">
      {{ c }}
    </button>
  </div>

  <button type="submit" class="btn btn-success">Salvar</button>
</form>
